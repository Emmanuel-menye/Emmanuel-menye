<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Boutique — Emmanuel Menye</title>
  <meta name="description" content="Boutique en ligne - exemple" />
  <link rel="stylesheet" href="assets/css/styles.css" />
</head>
<body>
  <header class="site-header">
    <div class="container">
      <h1>Boutique d'Emmanuel</h1>
      <button id="cart-toggle" class="cart-button" aria-expanded="false">Panier (<span id="cart-count">0</span>)</button>
    </div>
  </header>

  <main class="container">
    <section id="products" class="products-grid" aria-label="Produits">
      <!-- Produits injectés par JS -->
    </section>

    <aside id="cart" class="cart" aria-label="Panier" hidden>
      <h2>Votre panier</h2>
      <div id="cart-items"></div>
      <div class="cart-summary">
        <div>Total: <strong id="cart-total">0.00 €</strong></div>
        <div class="cart-actions">
          <button id="checkout" class="btn primary">Passer à la commande</button>
          <button id="clear-cart" class="btn">Vider le panier</button>
        </div>
      </div>
    </aside>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>© 2026 Emmanuel — Boutique exemple</p>
    </div>
  </footer>

  <script src="assets/js/shop.js" defer></script>
</body>
</html>
